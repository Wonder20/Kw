<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="kWh Tesla">
<title>Monte kWh Tesla</title>
<style>
:root{--bg:#E8EDF1;--card:#fff;--ink:#14212B;--mut:#5B6B78;--acc:#0A6F8F;--on:#fff;--pack:#2E7D4F;--warn:#B45309;--line:#D3DBE2;--veil:rgba(10,20,28,.5);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1A22;--card:#18262F;--ink:#E8EEF2;--mut:#93A4B1;--acc:#4CB8D6;--on:#08202A;--pack:#5CC48A;--warn:#F2A64B;--line:#2A3B47;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1A22;--card:#18262F;--ink:#E8EEF2;--mut:#93A4B1;--acc:#4CB8D6;--on:#08202A;--pack:#5CC48A;--warn:#F2A64B;--line:#2A3B47;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:520px;margin:0 auto;padding:20px 16px 40px}
.hero{background:var(--card);border-radius:20px;padding:22px 20px}
.lbl{color:var(--mut);font-size:15px}
.big{font:700 64px/1.05 ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;letter-spacing:-1px;margin:4px 0 14px;font-variant-numeric:tabular-nums}
.big small{font-size:24px;font-weight:600;color:var(--mut);letter-spacing:0;margin-left:6px}
.big.low{color:var(--warn)}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:6px;transition:width .4s}
.bar.low i{background:var(--warn)}
.sub{display:flex;justify-content:space-between;margin-top:10px;color:var(--mut);font-size:14px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 22px}
button{font:inherit;border:0;border-radius:14px;padding:15px 12px;font-weight:600;cursor:pointer}
.p{background:var(--acc);color:var(--on)}
.s{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
h2{font-size:17px;margin:0 0 8px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);color:var(--ink);padding:10px 14px 10px 10px;border-radius:14px;margin-bottom:8px;font-weight:400}
.th{width:52px;height:52px;border-radius:10px;background:var(--bg);flex:none;object-fit:cover;display:grid;place-items:center;color:var(--mut);font-size:22px}
.row .m{flex:1;min-width:0}
.row .k{font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.row .d{color:var(--mut);font-size:14px}
.row .k.in{color:var(--pack)}
.empty{color:var(--mut);padding:18px 4px}
.veil{position:fixed;inset:0;background:var(--veil);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:92%;overflow-y:auto}
.sheet h3{margin:0 0 14px;font-size:20px}
label.f{display:block;margin-bottom:12px;color:var(--mut);font-size:14px}
input[type=text],input[type=date]{display:block;width:100%;margin-top:4px;font:inherit;font-size:18px;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px;min-height:50px}
.ph{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.ph img{width:64px;height:64px;border-radius:10px;object-fit:cover}
.err{color:var(--warn);min-height:20px;font-size:14px;margin:0 0 8px}
.acts{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.full{width:100%;max-height:60vh;object-fit:contain;border-radius:12px;background:var(--bg);margin-bottom:12px}
.danger{background:var(--card);color:var(--warn);box-shadow:inset 0 0 0 1.5px var(--warn)}
.note{background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:12px;color:var(--warn);font-size:14px}
</style>
</head>
<body>
<main>
  <section class="hero">
    <div class="lbl">kWh rimasti</div>
    <div class="big" id="bal">–<small>kWh</small></div>
    <div class="bar" id="bar"><i style="width:0"></i></div>
    <div class="sub"><span id="used"></span><span id="bought"></span></div>
  </section>
  <div class="btns">
    <button class="p" id="bCharge">Nuova ricarica</button>
    <button class="s" id="bPack">Aggiungi pacchetto</button>
  </div>
  <div class="note" id="note" hidden></div>
  <h2>Storico</h2>
  <div id="list"><div class="empty">Caricamento…</div></div>
</main>

<div class="veil" id="sheet" hidden>
  <div class="sheet">
    <h3 id="sTitle"></h3>
    <label class="f">kWh
      <input type="text" id="kwh" inputmode="decimal" autocomplete="off" placeholder="es. 42,5">
    </label>
    <label class="f">Data
      <input type="date" id="date">
    </label>
    <div id="photoRow">
      <div class="ph">
        <button class="s" id="bPhoto" type="button">Aggiungi foto</button>
        <img id="prev" alt="Anteprima della foto" hidden>
      </div>
      <input type="file" id="photo" accept="image/*" hidden>
    </div>
    <p class="err" id="err" role="alert"></p>
    <div class="acts">
      <button class="s" id="bCancel" type="button">Annulla</button>
      <button class="p" id="bSave" type="button">Salva</button>
    </div>
  </div>
</div>

<div class="veil" id="detail" hidden>
  <div class="sheet">
    <h3 id="dTitle"></h3>
    <img class="full" id="dImg" alt="Foto della ricarica" hidden>
    <p class="lbl" id="dDate"></p>
    <div class="acts">
      <button class="s" id="dClose" type="button">Chiudi</button>
      <button class="danger" id="dDel" type="button">Elimina</button>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const nf = n => n.toLocaleString('it-IT', {maximumFractionDigits: 2});
const fdate = d => new Date(d + 'T12:00:00').toLocaleDateString('it-IT', {day: 'numeric', month: 'short', year: 'numeric'});
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
let dbh = null, entries = [], mode = 'charge', file = null, cur = null, armed = false, curUrl = null;
const idb = () => new Promise((ok, ko) => { const r = indexedDB.open('kwh-tesla', 1); r.onupgradeneeded = () => { r.result.createObjectStore('entries', {keyPath: 'id'}); r.result.createObjectStore('photos'); }; r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error); });
const tx = (stores, fn) => new Promise((ok, ko) => { const t = dbh.transaction(stores, 'readwrite'); fn(t); t.oncomplete = () => ok(); t.onerror = () => ko(t.error); t.onabort = () => ko(t.error); });
const getAll = () => new Promise((ok, ko) => { const r = dbh.transaction('entries').objectStore('entries').getAll(); r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error); });
const getPhoto = id => new Promise((ok, ko) => { const r = dbh.transaction('photos').objectStore('photos').get(id); r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error); });

function note(t) { const n = $('#note'); n.textContent = t || ''; n.hidden = !t; }

function render() {
  const rows = entries.slice().sort((a, b) => (b.date || '').localeCompare(a.date || '') || (b.ts || 0) - (a.ts || 0));
  let inn = 0, out = 0;
  rows.forEach(e => e.type === 'pack' ? inn += e.kwh : out += e.kwh);
  const bal = inn - out, low = inn > 0 && bal / inn < 0.2;
  const b = $('#bal'); b.textContent = nf(Math.round(bal * 100) / 100);
  const u = document.createElement('small'); u.textContent = 'kWh'; b.appendChild(u);
  b.classList.toggle('low', low || bal < 0);
  $('#bar').classList.toggle('low', low || bal < 0);
  $('#bar i').style.width = (inn > 0 ? Math.max(0, Math.min(100, bal / inn * 100)) : 0) + '%';
  $('#used').textContent = 'Caricati ' + nf(Math.round(out * 100) / 100);
  $('#bought').textContent = 'Acquistati ' + nf(Math.round(inn * 100) / 100);
  const list = $('#list'); list.textContent = '';
  if (!rows.length) { const d = document.createElement('div'); d.className = 'empty'; d.textContent = 'Inizia aggiungendo il tuo pacchetto di kWh.'; list.appendChild(d); return; }
  rows.forEach(e => {
    const r = document.createElement('button'); r.className = 'row';
    let t;
    if (e.thumb) { t = document.createElement('img'); t.src = e.thumb; t.alt = ''; t.className = 'th'; }
    else { t = document.createElement('div'); t.className = 'th'; t.textContent = e.type === 'pack' ? '+' : '⚡'; }
    const m = document.createElement('div'); m.className = 'm';
    const k = document.createElement('div'); k.className = 'k' + (e.type === 'pack' ? ' in' : '');
    k.textContent = (e.type === 'pack' ? '+' : '−') + nf(e.kwh) + ' kWh';
    const d = document.createElement('div'); d.className = 'd';
    d.textContent = (e.type === 'pack' ? 'Pacchetto · ' : '') + fdate(e.date);
    m.append(k, d); r.append(t, m);
    r.onclick = () => openDetail(e);
    list.appendChild(r);
  });
}

function openSheet(m) {
  mode = m; file = null;
  $('#sTitle').textContent = m === 'charge' ? 'Nuova ricarica' : 'Nuovo pacchetto di kWh';
  $('#kwh').value = ''; $('#date').value = today(); $('#err').textContent = '';
  $('#photoRow').hidden = m !== 'charge'; $('#prev').hidden = true; $('#photo').value = '';
  $('#bPhoto').textContent = 'Aggiungi foto';
  $('#bSave').disabled = false; $('#bSave').textContent = 'Salva';
  $('#sheet').hidden = false;
}

function draw(img, max) {
  const s = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
  c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c;
}
function prep(f) {
  return new Promise((ok, ko) => {
    const u = URL.createObjectURL(f), im = new Image();
    im.onload = () => {
      draw(im, 1600).toBlob(full => {
        const thumb = draw(im, 160).toDataURL('image/jpeg', .6);
        URL.revokeObjectURL(u); full ? ok({full, thumb}) : ko(new Error('toBlob'));
      }, 'image/jpeg', .82);
    };
    im.onerror = () => ko(new Error('img'));
    im.src = u;
  });
}

async function save() {
  const kwh = parseFloat($('#kwh').value.replace(',', '.'));
  const err = $('#err');
  if (!(kwh > 0)) { err.textContent = 'Inserisci i kWh, ad esempio 42,5.'; return; }
  if (!dbh) { err.textContent = 'Memoria del telefono non disponibile. Riapri la pagina.'; return; }
  const btn = $('#bSave'); btn.disabled = true; btn.textContent = 'Salvo…'; err.textContent = '';
  const doc = {id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), type: mode, kwh: Math.round(kwh * 100) / 100, date: $('#date').value || today(), ts: Date.now()};
  let full = null;
  try {
    if (mode === 'charge' && file) {
      const p = await prep(file);
      full = p.full; doc.thumb = p.thumb; doc.hasPhoto = true;
    }
    await tx(['entries', 'photos'], t => { t.objectStore('entries').put(doc); if (full) t.objectStore('photos').put(full, doc.id); });
    entries.push(doc); render();
    $('#sheet').hidden = true;
  } catch (e) {
    btn.disabled = false; btn.textContent = 'Salva';
    err.textContent = 'Salvataggio non riuscito. Prova con un’altra foto o salva senza foto.';
  }
}

function openDetail(e) {
  cur = e; armed = false;
  $('#dTitle').textContent = (e.type === 'pack' ? '+' : '−') + nf(e.kwh) + ' kWh';
  $('#dDate').textContent = (e.type === 'pack' ? 'Pacchetto acquistato il ' : 'Ricarica del ') + fdate(e.date);
  const img = $('#dImg');
  img.removeAttribute('src'); img.hidden = true;
  if (curUrl) { URL.revokeObjectURL(curUrl); curUrl = null; }
  if (e.hasPhoto) getPhoto(e.id).then(b => { if (b && cur === e) { curUrl = URL.createObjectURL(b); img.src = curUrl; img.hidden = false; } }).catch(() => {});
  $('#dDel').textContent = 'Elimina';
  $('#detail').hidden = false;
}

async function del() {
  if (!armed) { armed = true; $('#dDel').textContent = 'Tocca ancora per eliminare'; return; }
  try {
    const id = cur.id;
    await tx(['entries', 'photos'], t => { t.objectStore('entries').delete(id); t.objectStore('photos').delete(id); });
    entries = entries.filter(x => x.id !== id); render();
    $('#detail').hidden = true;
  } catch (e) { $('#dDel').textContent = 'Non riuscito. Riprova'; armed = false; }
}

$('#bCharge').onclick = () => openSheet('charge');
$('#bPack').onclick = () => openSheet('pack');
$('#bCancel').onclick = () => $('#sheet').hidden = true;
$('#bSave').onclick = save;
$('#bPhoto').onclick = () => $('#photo').click();
$('#photo').onchange = e => {
  file = e.target.files[0] || null;
  if (file) { $('#prev').src = URL.createObjectURL(file); $('#prev').hidden = false; $('#bPhoto').textContent = 'Cambia foto'; }
};
$('#dClose').onclick = () => $('#detail').hidden = true;
$('#dDel').onclick = del;

(async () => {
  try {
    dbh = await idb();
    entries = await getAll();
    render();
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  } catch (e) {
    $('#list').textContent = '';
    note('Questo browser non permette di salvare i dati. Apri la pagina in Safari, fuori dalla navigazione privata.');
  }
})();
</script>
</body>
</html>
